name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Stockfish network
        uses: actions/cache@v4
        with:
          path: android/stockfish/nets
          key: nnue-${{ hashFiles('android/stockfish/src/evaluate.h') }}

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          ls "$ANDROID_HOME/ndk"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/ZorixChess-1.0.0.apk
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: ZorixChess-apk
          path: out/ZorixChess-1.0.0.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="zorix-chess-build-${{ github.run_number }}"
          gh release create "$TAG" ../out/ZorixChess-1.0.0.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "Zorix Chess (Android) build ${{ github.run_number }}" \
            --notes "Android APK built from ${{ github.ref_name }} @ ${{ github.sha }}. Works offline (Stockfish 19 included). Signed with a debug key: fine for installing, set your own key before publishing to a store."
