# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Android / Kotlin
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# iOS targets are only built on macOS; do not warn about them on Windows/Linux.
kotlin.native.ignoreDisabledTargets=true
kotlin.apple.xcodeCompatibility.nowarn=true

# Zorix Chess - Stockfish engine build
# ABIs to build the engine for. Remove x86_64 if you never use the emulator,
# or keep only arm64-v8a for the fastest local builds on a real phone.
zorix.stockfish.abis=arm64-v8a,armeabi-v7a,x86_64
# NDK used to compile Stockfish (r27c). Install it once from Android Studio:
# Settings > Languages & Frameworks > Android SDK > SDK Tools > NDK (Side by side).
# If this exact version is missing, the newest installed NDK (r25 or later) is used.
zorix.ndkVersion=27.2.12479018
# API level Stockfish is compiled for (default = minSdk 26, Android 8.0).
# zorix.stockfish.api=26

# Optional release signing (otherwise release builds are signed with the debug key):
# zorix.keystore=/path/to/zorix-release.jks
# zorix.keystorePassword=...
# zorix.keyAlias=zorix
# zorix.keyPassword=...
